<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #ffd36e 0%, #ff8c6b 50%, #ff6b6b 100%);
    overflow: hidden;
  }
  #page1, #page2 {
    text-align: center;
    padding: 30px;
    max-width: 90vw;
  }
  #page2 { display: none; }
  h1 {
    color: #4a2540;
    font-size: 1.8em;
    margin-bottom: 10px;
  }
  #msg {
    color: #6b3654;
    font-size: 1em;
    min-height: 24px;
    margin-bottom: 25px;
    font-weight: 600;
  }
  .btn-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.15s ease;
    padding: 14px 28px;
  }
  #btnSim {
    background: #ff4b7d;
    color: white;
    font-size: 1em;
    box-shadow: 0 4px 15px rgba(255,75,125,0.4);
  }
  #btnNao {
    background: #ddd;
    color: #555;
    font-size: 1em;
  }
  #page2 {
    color: #4a2540;
  }
  #page2 h1 { font-size: 2em; }
  .detalhe {
    background: rgba(255,255,255,0.6);
    border-radius: 16px;
    padding: 20px 30px;
    margin: 10px auto;
    max-width: 320px;
    font-size: 1.1em;
  }
  .emoji { font-size: 3em; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="page1">
  <h1>Quer sair cmg?</h1>
  <div id="msg">&nbsp;</div>
  <div class="btn-row">
    <button id="btnSim" onclick="dizerSim()">Sim</button>
    <button id="btnNao" onclick="dizerNao()">Não</button>
  </div>
</div>

<div id="page2">
  <div class="emoji">🤝</div>
  <h1>Acho bom</h1>
  <div class="detalhe">📍 <strong>Local:</strong> Impulso Park</div>
  <div class="detalhe">📅 <strong>Dia:</strong> 11/09 (sexta)</div>
  <div class="detalhe">🕗 <strong>Horário:</strong> 19h</div>
</div>

<script>
  const mensagens = [
    "Sério? De novo essa?",
    "Tá difícil assim, hein",
    "Vai fingir que não quer ir",
    "Eu já sei que vc vai clicar no Sim",
    "Só falta admitir",
    "O Não já era, olha o tamanho",
    "Chega de encenação",
    "Não tem mais Não pra clicar",
    "Só resta uma opção agora",
    "Para de implicância e clica 😏"
  ];

  let cliquesNao = 0;
  let simScale = 1;
  const btnSim = document.getElementById('btnSim');
  const btnNao = document.getElementById('btnNao');
  const msg = document.getElementById('msg');

  function dizerNao() {
    cliquesNao++;
    const nivel = Math.min(cliquesNao, mensagens.length) - 1;
    msg.textContent = mensagens[nivel];

    // Não encolhe
    const naoScale = Math.max(0.3, 1 - cliquesNao * 0.08);
    btnNao.style.transform = `scale(${naoScale})`;
    btnNao.style.opacity = Math.max(0.2, 1 - cliquesNao * 0.08);

    // Sim cresce
    simScale = Math.min(2.5, 1 + cliquesNao * 0.15);
    btnSim.style.transform = `scale(${simScale})`;

    // depois de muitos cliques, some de vez
    if (cliquesNao >= 10) {
      btnNao.style.display = 'none';
      msg.textContent = "Tá sem opção agora";
    }
  }

  function dizerSim() {
    document.getElementById('page1').style.display = 'none';
    document.getElementById('page2').style.display = 'block';
  }
</script>

</body>
</html>
